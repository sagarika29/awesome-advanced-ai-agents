<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGs of Tech — Founder OG</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #11182d;
        --border: #24304f;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --chip: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #152039, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px 24px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .brand {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      h1 {
        margin: 6px 0 4px;
        font-size: 28px;
      }
      .tagline {
        color: var(--muted);
        margin-bottom: 18px;
      }
      #thread {
        flex: 1;
        overflow: auto;
        padding-bottom: 16px;
      }
      .empty, .card, .user {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .user {
        align-self: flex-end;
        background: var(--chip);
        max-width: 85%;
        margin-left: auto;
      }
      .card .type {
        color: #93c5fd;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card h3 {
        margin: 8px 0 10px;
        font-size: 18px;
      }
      .card li {
        color: #cbd5e1;
        margin: 4px 0;
      }
      .assistant-text {
        margin-bottom: 10px;
        color: #e2e8f0;
      }
      #status {
        display: none;
        align-self: center;
        background: #1a2440;
        border-radius: 999px;
        padding: 8px 14px;
        color: #dbeafe;
        margin: 8px auto;
        width: fit-content;
      }
      #status.show { display: block; }
      #actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      #actions button {
        background: var(--chip);
        color: #eff6ff;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #actions button:disabled { opacity: 0.5; cursor: default; }
      .composer {
        display: flex;
        gap: 10px;
      }
      .composer input {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        color: var(--text);
        padding: 14px 16px;
      }
      .composer button {
        background: var(--accent);
        color: #0b1020;
        border: 0;
        border-radius: 16px;
        padding: 14px 18px;
        font-weight: 800;
        cursor: pointer;
      }
      .composer button:disabled { opacity: 0.6; }
      #error {
        color: #fca5a5;
        margin: 8px 0;
        display: none;
      }
      #error.show { display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">OGs of Tech</div>
      <h1 id="persona-name">Founder OG</h1>
      <div class="tagline" id="persona-tagline">Ship fast, learn faster.</div>
      <div id="error"></div>
      <div id="thread">
        <div class="empty">
          <strong>Ask Founder OG anything</strong>
          <p>Try: “Help me build an AI scheduling app for busy founders.”</p>
        </div>
      </div>
      <div id="status"></div>
      <div id="actions"></div>
      <div class="composer">
        <input id="input" placeholder="Ask Founder OG..." />
        <button id="send">Ask</button>
      </div>
    </div>
    <script>
      let sessionId = null;
      let busy = false;
      const thread = document.getElementById("thread");
      const statusEl = document.getElementById("status");
      const actionsEl = document.getElementById("actions");
      const errorEl = document.getElementById("error");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");

      function setError(msg) {
        errorEl.textContent = msg || "";
        errorEl.classList.toggle("show", Boolean(msg));
      }

      function setStatus(label) {
        statusEl.textContent = label || "";
        statusEl.classList.toggle("show", Boolean(label));
      }

      function clearEmpty() {
        const empty = thread.querySelector(".empty");
        if (empty) empty.remove();
      }

      function addUser(text) {
        clearEmpty();
        const el = document.createElement("div");
        el.className = "user";
        el.textContent = text;
        thread.appendChild(el);
      }

      function renderAssistant(text, cards, actions) {
        clearEmpty();
        const wrap = document.createElement("div");
        if (text) {
          const p = document.createElement("div");
          p.className = "assistant-text";
          p.textContent = text;
          wrap.appendChild(p);
        }
        for (const card of cards) {
          const cardEl = document.createElement("div");
          cardEl.className = "card";
          const lines = Array.isArray(card.body) ? card.body : [card.body];
          cardEl.innerHTML =
            `<div class="type">${String(card.card_type).replace(/_/g, " ")}</div>` +
            `<h3>${card.title}</h3>` +
            `<ul>${lines.map((l) => `<li>${l}</li>`).join("")}</ul>`;
          wrap.appendChild(cardEl);
        }
        thread.appendChild(wrap);
        actionsEl.innerHTML = "";
        for (const action of actions) {
          const btn = document.createElement("button");
          btn.textContent = action.label;
          btn.onclick = () => runChat({ actionId: action.id, message: "Follow-up action" });
          actionsEl.appendChild(btn);
        }
      }

      async function loadPersona() {
        try {
          const res = await fetch("/personas");
          const personas = await res.json();
          const founder = personas.find((p) => p.id === "founder_og") || personas[0];
          if (founder) {
            document.getElementById("persona-name").textContent = founder.name;
            document.getElementById("persona-tagline").textContent = founder.tagline;
          }
        } catch (e) {
          setError("Could not load Founder OG. Is the API running?");
        }
      }

      async function runChat({ message, actionId }) {
        if (busy) return;
        busy = true;
        sendBtn.disabled = true;
        [...actionsEl.querySelectorAll("button")].forEach((b) => (b.disabled = true));
        setError("");
        setStatus("Thinking");
        if (message && !actionId) addUser(message);

        let assistantText = "";
        let cards = [];
        let actions = [];

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "text/event-stream",
            },
            body: JSON.stringify({
              session_id: sessionId,
              persona_id: "founder_og",
              message: message || "",
              action_id: actionId || null,
            }),
          });
          if (!res.ok) throw new Error(`Chat failed (${res.status})`);

          const reader = res.body?.getReader?.();
          const handleEvent = (event) => {
            if (event.type === "status") setStatus(event.payload.label || "Thinking");
            if (event.type === "message_delta") assistantText = event.payload.text || "";
            if (event.type === "card") cards = [...cards, event.payload];
            if (event.type === "actions") actions = event.payload.items || [];
            if (event.type === "done") setStatus("");
          };

          if (!reader) {
            const text = await res.text();
            for (const chunk of text.split("\n\n")) {
              if (!chunk.trim()) continue;
              const lines = chunk.split("\n");
              let eventName = "message";
              let data = "";
              for (const line of lines) {
                if (line.startsWith("event:")) eventName = line.slice(6).trim();
                else if (line.startsWith("data:")) data += line.slice(5).trim();
              }
              if (!data) continue;
              if (eventName === "session") sessionId = data;
              else handleEvent(JSON.parse(data));
            }
          } else {
            const decoder = new TextDecoder();
            let buffer = "";
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const parts = buffer.split("\n\n");
              buffer = parts.pop() || "";
              for (const chunk of parts) {
                const lines = chunk.split("\n");
                let eventName = "message";
                let data = "";
                for (const line of lines) {
                  if (line.startsWith("event:")) eventName = line.slice(6).trim();
                  else if (line.startsWith("data:")) data += line.slice(5).trim();
                }
                if (!data) continue;
                if (eventName === "session") sessionId = data;
                else handleEvent(JSON.parse(data));
              }
            }
          }
          renderAssistant(assistantText, cards, actions);
        } catch (e) {
          setError(e.message || "Request failed");
          setStatus("");
        } finally {
          busy = false;
          sendBtn.disabled = false;
        }
      }

      sendBtn.onclick = () => {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        runChat({ message: text });
      };
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendBtn.click();
      });

      loadPersona();
    </script>
  </body>
</html>
